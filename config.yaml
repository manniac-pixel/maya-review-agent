scraper:
  maya:
    google_play_app_id: "com.paymaya"
    ios_app_id: 1488600019
    ios_app_name: "maya-savings-credit-crypto"
  gcash:
    google_play_app_id: "com.globe.gcash.android"
    ios_app_id: 520020791
    ios_app_name: "gcash"
  gplay_batch_size: 200
  gplay_max_batches: 50
  gplay_sleep_seconds: 1.5
  ios_review_count: 5000
  ios_fallback_countries: ["us", "gb"]
  ios_sleep_seconds: 2

llm:
  gemini_model: "gemini-2.0-flash"
  ollama_model: "llama3.1:8b"
  ollama_url: "http://localhost:11434"
  max_retries: 4
  gemini_base_delay_seconds: 60

data_quality:
  min_total_reviews: 30
  min_monthly_reviews: 5
  min_per_platform: 10
  stale_days: 60

temporal:
  max_reviews_per_month: 150
  max_reviews_per_version: 80
  min_reviews_per_version: 20
  inter_call_delay_seconds: 10

comprehensive:
  max_reviews_per_chunk: 200
  max_chunks: 5
  inter_call_delay_seconds: 10

competitor:
  sample_per_app: 150

journey:
  freq_weight:
    high: 3
    medium: 2
    low: 1
  trend_weight:
    emerging: 1.5
    persistent: 1.2
    resolved: 0.3

funnel:
  max_signal_reviews: 300
  inter_call_delay_seconds: 10

accessibility:
  max_signal_reviews: 250

visualizations:
  dpi: 150

logging:
  level: "INFO"
  file: "data/maya_agent.log"

output:
  data_dir: "data"
